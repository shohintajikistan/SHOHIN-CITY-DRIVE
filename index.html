<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c16"><title>SHOHIN CITY DRIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b1d;color:#fff;font-family:Arial,system-ui,sans-serif;touch-action:none}#renderCanvas{width:100%;height:100%;display:block;outline:0}
#boot,#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#183f32,#030907 78%);padding:22px}.panel{width:min(430px,100%);padding:26px 22px;text-align:center;border:1px solid #baf05b66;border-radius:24px;background:linear-gradient(145deg,#0b3025f5,#06140ff5);box-shadow:0 25px 90px #000c}.crown{font-size:42px;color:#e6c46a}.panel h1{font-size:25px;letter-spacing:1px;color:#baf05b;margin:8px 0}.panel p{font-size:13px;line-height:1.55;color:#d1ded6}.primary{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#baf05b,#e3f6ad);color:#071c16;font-weight:950;font-size:15px;letter-spacing:1px}.sub{font-size:10px;letter-spacing:2px;color:#b8c9bf}
#boot{z-index:20;transition:opacity .35s}#boot.hide{opacity:0;pointer-events:none}.track{height:6px;background:#ffffff20;border-radius:9px;margin-top:22px;overflow:hidden}.fill{height:100%;width:0;background:#baf05b;transition:width .2s}
#hud{display:none;position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:950;letter-spacing:2px;color:#baf05b;text-shadow:0 2px 7px #000}.small{font-size:9px;letter-spacing:2px;color:#d7e3dc}.stats{display:flex;gap:6px}.stat{background:#071c16cf;border:1px solid #baf05b66;border-radius:12px;padding:7px 10px;min-width:62px;text-align:center;backdrop-filter:blur(8px)}.num{font-size:20px;font-weight:900;color:#baf05b}.lab{font-size:8px;color:#c8d8ce;letter-spacing:1px}
#map{position:absolute;top:65px;left:14px;width:112px;height:112px;border-radius:50%;border:2px solid #dcebe5aa;background:#071c16b8;box-shadow:0 3px 14px #0008}
#speedo{position:absolute;right:15px;top:65px;width:116px;height:116px;border:5px solid #e5eee9;border-bottom-color:transparent;border-radius:50%;background:#071c16aa;display:grid;place-items:center;text-align:center}.speedbig{font-size:28px;font-weight:900}.speedunit{font-size:9px;letter-spacing:1px}
#actions{position:absolute;right:14px;top:195px;display:flex;gap:8px;pointer-events:auto}.pill{border:1px solid #baf05b77;border-radius:12px;background:#071c16df;color:#fff;padding:9px 11px;font-weight:800}
#controls{position:absolute;bottom:calc(15px + env(safe-area-inset-bottom));left:0;right:0;padding:0 16px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:9px;pointer-events:auto}.key{width:64px;height:64px;border-radius:19px;border:1px solid #d9eee0a8;background:linear-gradient(145deg,#ffffff42,#071c16dd);color:#fff;font-size:25px;font-weight:900;box-shadow:0 6px 20px #0008;touch-action:none;user-select:none}.key.down{background:#baf05b;color:#071c16}.key.gas{height:86px;width:76px;font-size:13px;color:#baf05b}.key.brake{height:68px;width:68px;font-size:11px}.key.hand{height:52px;width:65px;font-size:10px}
#toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-weight:900;color:#f9dc8e;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .2s}
@media(max-width:390px){.key{width:54px;height:57px}.key.gas{width:66px;height:77px}.stat{min-width:53px;padding:6px}.num{font-size:17px}#map{width:92px;height:92px}#speedo{width:100px;height:100px}}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="boot"><div class="panel"><div class="crown">♛</div><div class="brand" style="font-size:22px">SHOHIN TAJIKISTAN</div><div class="sub">CITY DRIVE · REAL 3D</div><div class="track"><div class="fill" id="loadFill"></div></div><p id="loadText">ЗАГРУЗКА ИГРОВОГО МИРА</p></div></div>
<div id="menu" style="display:none"><div class="panel"><div class="crown">♛</div><h1>SHOHIN CITY DRIVE</h1><div class="sub">OPEN CITY · FREE DRIVE</div><p>Свободное вождение. Исследуй город, разгоняйся, тормози и объезжай транспорт.</p><button class="primary" id="start">НАЧАТЬ ВОЖДЕНИЕ</button><p class="sub">WASD / СТРЕЛКИ · TOUCH CONTROL</p></div></div>
<div id="hud"><div class="top"><div><div class="brand">♛ SHOHIN</div><div class="small">CITY DRIVE · GT SPORT</div></div><div class="stats"><div class="stat"><div class="num" id="speed">0</div><div class="lab">KM/H</div></div><div class="stat"><div class="num" id="gear">N</div><div class="lab">GEAR</div></div></div></div><canvas id="map" width="220" height="220"></canvas><div id="speedo"><div><div class="speedbig" id="speedDial">0</div><div class="speedunit">KM/H</div><div class="lab">ABS · SPORT</div></div></div><div id="actions"><button class="pill" id="camera">КАМЕРА</button><button class="pill" id="pause">Ⅱ</button></div><div id="toast">TURBO BOOST</div><div id="controls"><div class="cluster"><button class="key" data-k="left">◀</button><button class="key" data-k="right">▶</button></div><div class="cluster"><button class="key hand" data-k="hand">РУЧНИК</button><button class="key brake" data-k="brake">ТОРМОЗ</button><button class="key gas" data-k="gas">ГАЗ ▲</button></div></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=> {
const $=id=>document.getElementById(id),canvas=$('renderCanvas');
let engine,scene,camera,car,body,wheels=[],traffic=[],colliders=[],heading=0,speed=0,lateral=0,started=false,paused=false,camMode=0,boost=100,score=0;
const keys={left:false,right:false,gas:false,brake:false,hand:false};
const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
const mat=(name,color,rough=.7,metal=0)=>{const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);m.specularColor=new BABYLON.Color3(.35,.35,.35);m.specularPower=64;m.alpha=1;return m};
const v=(x,y,z)=>new BABYLON.Vector3(x,y,z);
function box(name,pos,size,material,parent=scene){const m=BABYLON.MeshBuilder.CreateBox(name,{width:size[0],height:size[1],depth:size[2]},scene);m.position=pos;m.material=material;if(parent)m.parent=parent;m.isPickable=false;return m}
function cyl(name,pos,diam,height,material,parent=scene){const m=BABYLON.MeshBuilder.CreateCylinder(name,{diameter:diam,height,tessellation:24},scene);m.position=pos;m.material=material;m.parent=parent;m.isPickable=false;return m}
function makeCar(){
 car=new BABYLON.TransformNode('player-car',scene);body=new BABYLON.TransformNode('car-body',scene);body.parent=car;
 const paint=mat('deep emerald','#0a9b68',.22,.75),dark=mat('carbon','#101719',.35,.6),glass=mat('glass','#263f49',.14,.65),rubber=mat('rubber','#090b0c',.95),rim=mat('alloy','#c4c9c7',.22,.85),red=mat('tail lights','#ff1717',.25,.2),white=mat('headlights','#fff0c7',.2,.1);
 // Low, wide sports-coupe silhouette: sculpted body, cabin, front and rear aero.
 box('main chassis',v(0,.69,0),[1.95,.48,4.25],paint,body);
 box('front hood',v(0,.87,-1.43),[1.82,.17,1.25],paint,body);
 box('rear deck',v(0,.91,1.48),[1.9,.2,1.1],paint,body);
 const cabin=BABYLON.MeshBuilder.CreateSphere('fastback cabin',{diameter:1,segments:24},scene);cabin.scaling=v(.78,.48,1.12);cabin.position=v(0,1.22,-.12);cabin.material=glass;cabin.parent=body;
 const roof=box('roof',v(0,1.52,.02),[1.05,.13,1.12],paint,body);
 for(const x of [-.78,.78]){
  box('side skirt',v(x,.49,.08),[.13,.18,2.5],dark,body);
  box('mirror',v(x*1.23,1.12,-.7),[.27,.13,.32],paint,body);
  box('side intake',v(x*1.12,.78,1.02),[.08,.25,.55],dark,body);
 }
 box('front splitter',v(0,.43,-2.13),[2.05,.08,.38],dark,body);
 box('rear diffuser',v(0,.42,2.08),[1.85,.13,.38],dark,body);
 box('rear wing',v(0,1.36,1.78),[2.08,.11,.42],dark,body);
 for(const x of [-.72,.72]){
  box('wing support',v(x,1.17,1.68),[.08,.35,.13],rim,body);
  box('front lamp',v(x,.8,-2.06),[.42,.09,.09],white,body);
  box('rear lamp',v(x,.8,2.09),[.48,.11,.08],red,body);
 }
 box('rear lightbar',v(0,.83,2.1),[.75,.055,.055],red,body);
 for(const x of [-.55,.55])cyl('exhaust',v(x,.48,2.19),.19,.16,rim,body).rotation.x=Math.PI/2;
 // Four independent wheel assemblies with visible alloy rims.
 for(const x of [-.99,.99])for(const z of [-1.32,1.32]){
  const pivot=new BABYLON.TransformNode('wheel pivot',scene);pivot.parent=body;pivot.position=v(x,.48,z);
  const tire=BABYLON.MeshBuilder.CreateCylinder('performance tyre',{diameter:.82,height:.25,tessellation:32},scene);tire.rotation.z=Math.PI/2;tire.material=rubber;tire.parent=pivot;
  const rimMesh=BABYLON.MeshBuilder.CreateCylinder('alloy rim',{diameter:.49,height:.27,tessellation:24},scene);rimMesh.rotation.z=Math.PI/2;rimMesh.material=rim;rimMesh.parent=pivot;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;const spoke=box('rim spoke',v(x>0?.145:-.145,Math.cos(a)*.17,Math.sin(a)*.17),[.045,.22,.045],rim,pivot);spoke.rotation.x=a}
  wheels.push({pivot,front:z<0,tire,rimMesh});
 }
 return car;
}
function createCity(){
 const ground=mat('concrete','#747b78',.96),road=mat('asphalt','#252c30',.98),line=mat('lane paint','#d9d9cf',.8),curb=mat('sidewalk','#a8aaa2',.9);
 const g=box('city ground',v(0,-.18,0),[430,.25,430],ground);g.receiveShadows=true;
 // 9 x 9 street grid with sidewalks and dashed lane markings.
 const roads=[];for(let p=-180;p<=180;p+=45)roads.push(p);
 for(const p of roads){
  box('north south road',v(p,-.035,0),[17,.06,410],road);
  box('east west road',v(0,-.03,p),[410,.06,17],road);
  for(let z=-195;z<200;z+=13)box('lane dash',v(p,.005,z),[.13,.025,5.3],line);
  for(let x=-195;x<200;x+=13)box('lane dash',v(x,.005,p),[5.3,.025,.13],line);
  for(const s of [-1,1]){box('walkway',v(p+s*10.4,.015,0),[2.7,.1,400],curb);box('walkway',v(0,.018,p+s*10.4),[400,.1,2.7],curb)}
 }
 const walls=['#b9b5a9','#9ca9ad','#d1c7b5','#707b80','#c5c3ba','#a7a18f'];
 let seed=13;const rand=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
 const facade=mat('window glass','#365762',.18,.65),trim=mat('building trim','#50585a',.6,.2);
 for(let gx=-4;gx<=3;gx++)for(let gz=-4;gz<=3;gz++){
  const x=gx*45+22.5+(rand()-.5)*5,z=gz*45+22.5+(rand()-.5)*5,w=15+rand()*7,d=15+rand()*7,h=11+rand()*27;
  const wall=mat('building '+gx+','+gz,walls[Math.floor(rand()*walls.length)],.82);
  const b=box('building',v(x,h/2,z),[w,h,d],wall);b.receiveShadows=true;
  colliders.push({x,z,hx:w/2+1.25,hz:d/2+1.25});
  box('roof ledge',v(x,h+.12,z),[w+.3,.24,d+.3],trim);
  const floors=Math.floor(h/3.1),cols=Math.max(2,Math.floor(w/3));
  for(let f=0;f<floors;f++)for(let c=0;c<cols;c++){
   const wx=x-w/2+(c+.5)*w/cols,wy=1.5+f*3.05;
   box('window',v(wx,wy,z-d/2-.045),[Math.max(.75,w/cols*.58),1.25,.07],facade);
   box('window sill',v(wx,wy-.69,z-d/2-.08),[Math.max(.85,w/cols*.68),.08,.12],trim);
  }
  // Storefront glazing.
  for(let c=0;c<3;c++)box('shopfront',v(x-w*.28+c*w*.28,1.3,z-d/2-.07),[w*.2,2.1,.08],facade);
 }
 const trunk=mat('tree bark','#59452e'),leaves=mat('tree leaves','#426b4b');
 for(let i=0;i<90;i++){const x=(rand()-.5)*360,z=(rand()-.5)*360;if(roads.some(p=>Math.abs(x-p)<13||Math.abs(z-p)<13))continue;cyl('tree trunk',v(x,1.35,z),.35,2.7,trunk);const crown=BABYLON.MeshBuilder.CreateSphere('tree crown',{diameter:3.2,segments:8},scene);crown.position=v(x,3.35,z);crown.material=leaves}
 const pole=mat('street lamp','#454c4c',.45,.6),lamp=mat('lamp glow','#fff0c5',.2);
 for(let x=-135;x<=135;x+=45)for(let z=-135;z<=135;z+=45){cyl('lamp post',v(x+12,3.1,z+12),.15,6.2,pole);box('lamp arm',v(x+12.7,6.1,z+12),[1.5,.08,.08],pole);box('lamp head',v(x+13.45,6,z+12),[.5,.16,.36],lamp)}
}
function createTraffic(){
 const colors=['#b8c0c1','#202b30','#9d3a30','#65766b','#d3c8a6'];
 for(let i=0;i<12;i++){
  const node=new BABYLON.TransformNode('traffic car',scene);
  const paint=mat('traffic paint '+i,colors[i%colors.length],.3,.45);
  box('traffic body',v(0,.62,0),[1.7,.55,3.5],paint,node);
  const cab=BABYLON.MeshBuilder.CreateBox('traffic cabin',{width:1.35,height:.58,depth:1.65},scene);cab.position=v(0,1.08,-.1);cab.material=mat('traffic glass '+i,'#3b5661',.18,.5);cab.parent=node;
  for(const x of [-.86,.86])for(const z of [-1.12,1.12]){const w=BABYLON.MeshBuilder.CreateCylinder('traffic wheel',{diameter:.58,height:.2,tessellation:16},scene);w.rotation.z=Math.PI/2;w.position=v(x,.39,z);w.material=mat('traffic rubber',' #101214'.trim(),.9);w.parent=node}
  const lane=(i%4),roadPos=-135+Math.floor(i/4)*90;node.position=v(lane<2?roadPos:roadPos,lane<2?0:0,lane<2?-160+i*11:roadPos);
  const horizontal=lane>=2;node.metadata={horizontal,dir:i%2?1:-1,road:roadPos};if(horizontal)node.rotation.y=Math.PI/2;
  traffic.push(node);
 }
}
function drawMap(){const c=$('map').getContext('2d');c.clearRect(0,0,220,220);c.fillStyle='#24332f';c.fillRect(0,0,220,220);c.strokeStyle='#89958b';c.lineWidth=7;for(let p=0;p<220;p+=27){c.beginPath();c.moveTo(p,0);c.lineTo(p,220);c.stroke();c.beginPath();c.moveTo(0,p);c.lineTo(220,p);c.stroke()}c.fillStyle='#baf05b';c.beginPath();c.arc(110+car.position.x*.38,110+car.position.z*.38,6,0,Math.PI*2);c.fill();c.save();c.translate(110+car.position.x*.38,110+car.position.z*.38);c.rotate(-heading);c.fillStyle='#fff';c.beginPath();c.moveTo(0,-12);c.lineTo(-7,8);c.lineTo(7,8);c.fill();c.restore()}
function init(){
 engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:!mobile},true);
 scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.57,.72,.79,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.0017;scene.fogColor=new BABYLON.Color3(.57,.72,.79);
 const hemi=new BABYLON.HemisphericLight('sky',v(0,1,0),scene);hemi.intensity=1.05;hemi.groundColor=new BABYLON.Color3(.25,.27,.23);
 const sun=new BABYLON.DirectionalLight('sun',v(-.55,-1,.35),scene);sun.position=v(-70,110,-45);sun.intensity=2.1;
 const shadows=new BABYLON.ShadowGenerator(mobile?1024:1536,sun);shadows.useBlurExponentialShadowMap=true;shadows.blurKernel=16;
 createCity();makeCar();createTraffic();
 for(const m of scene.meshes){if(m.name==='building'||m.name==='main chassis'||m.name==='front hood'||m.name==='rear deck'||m.name==='roof')shadows.addShadowCaster(m)}
 camera=new BABYLON.FollowCamera('chase',v(0,5,12),scene);camera.lockedTarget=car;camera.radius=10;camera.heightOffset=4;camera.rotationOffset=180;camera.cameraAcceleration=.045;camera.maxCameraSpeed=18;scene.activeCamera=camera;
 scene.onBeforeRenderObservable.add(()=>{
  const dt=Math.min(engine.getDeltaTime()/1000,.04);if(started&&!paused)update(dt);
  if(car){if(camMode===0){camera.radius=10;camera.heightOffset=3.6;camera.rotationOffset=180}else if(camMode===1){camera.radius=15;camera.heightOffset=6;camera.rotationOffset=180}else{camera.radius=6;camera.heightOffset=2.4;camera.rotationOffset=180}}
 });
 engine.runRenderLoop(()=>{if(scene)scene.render()});
 addEventListener('resize',()=>engine.resize());
}
function update(dt){
 const steer=(keys.left?1:0)-(keys.right?1:0),hand=keys.hand;
 if(keys.gas){if(speed<0)speed=Math.min(0,speed+25*dt);else speed=Math.min(48,speed+18*dt)}
 else if(keys.brake){if(speed>0)speed=Math.max(0,speed-29*dt);else speed=Math.max(-8,speed-10*dt)}
 else speed*=Math.exp(-.65*dt);
 if(hand&&Math.abs(speed)>7){lateral+=steer*Math.abs(speed)*.32*dt;score+=Math.abs(speed)*dt*.4;$('toast').style.opacity=1}else{$('toast').style.opacity=0;lateral*=Math.exp(-2.8*dt)}
 const steerAngle=steer*BABYLON.Scalar.Lerp(.48,.25,Math.min(1,Math.abs(speed)/24));
 heading+=(speed/2.8)*Math.tan(steerAngle)*dt;
 car.rotation.y=heading;
 const forward=v(Math.sin(heading),0,Math.cos(heading)),side=v(Math.cos(heading),0,-Math.sin(heading));
 const old=car.position.clone();car.position.addInPlace(forward.scale(speed*dt));car.position.addInPlace(side.scale(lateral*dt));
 car.position.x=BABYLON.Scalar.Clamp(car.position.x,-198,198);car.position.z=BABYLON.Scalar.Clamp(car.position.z,-198,198);
 for(const b of colliders){if(Math.abs(car.position.x-b.x)<b.hx&&Math.abs(car.position.z-b.z)<b.hz){car.position.copyFrom(old);speed*=-.12;lateral*=.15;break}}
 for(const w of wheels){w.pivot.rotation.y=w.front?steerAngle:0;w.pivot.rotation.x-=speed*dt/.41}
 body.rotation.z=BABYLON.Scalar.Lerp(body.rotation.z,-steer*speed*.0035,Math.min(1,dt*5));
 body.position.y=.03+Math.sin(performance.now()*.012)*Math.min(.025,Math.abs(speed)*.0007);
 for(const t of traffic){const horizontal=t.metadata.horizontal,dir=t.metadata.dir;if(horizontal){t.position.x+=dir*dt*8;if(t.position.x>190)t.position.x=-190;if(t.position.x< -190)t.position.x=190}else{t.position.z+=dir*dt*8;if(t.position.z>190)t.position.z=-190;if(t.position.z< -190)t.position.z=190}}
 const km=Math.round(Math.abs(speed)*3.6);$('speed').textContent=km;$('speedDial').textContent=km;$('gear').textContent=speed<-.5?'R':Math.abs(speed)<.5?'N':speed<15?'1':speed<28?'2':speed<40?'3':'4';
 drawMap();
}
function bindControls(){
 document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('down')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off))});
 addEventListener('keydown',e=>{const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'hand'};if(map[e.key])keys[map[e.key]]=true});
 addEventListener('keyup',e=>{const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'hand'};if(map[e.key])keys[map[e.key]]=false});
 $('start').onclick=()=>{$('menu').style.display='none';$('hud').style.display='block';started=true};
 $('camera').onclick=()=>camMode=(camMode+1)%3;
 $('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};
}
function boot(){
 try{init();bindControls();let p=0;const timer=setInterval(()=>{p=Math.min(100,p+8);$('loadFill').style.width=p+'%';if(p>=100){clearInterval(timer);$('boot').classList.add('hide');setTimeout(()=>$('boot').style.display='none',400);$('menu').style.display='flex'}},90)}
 catch(e){$('loadText').textContent='ОШИБКА: '+e.message;console.error(e)}
}
if(window.BABYLON)boot();else $('loadText').textContent='Не удалось загрузить Babylon.js. Проверь интернет.';
})();
</script>
</body></html>
