<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c16"><title>SHOHIN CITY DRIVE — 3D Driving Simulator</title>
<style>
:root{--bg:#071c16;--panel:#0d3024;--green:#08a56c;--lime:#baf05b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Arial,system-ui,sans-serif;touch-action:none}#renderCanvas{width:100%;height:100%;display:block;outline:none}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}.brand,.hud{background:#071c16dc;border:1px solid #08a56c88;border-radius:14px;padding:10px 13px;backdrop-filter:blur(9px);box-shadow:0 8px 25px #0005}.brand b{display:block;color:var(--lime);letter-spacing:2px;font-size:13px}.brand span{font-size:9px;color:#b6c9c0;letter-spacing:1px}.hud{text-align:right;min-width:105px}.hud strong{font-size:26px;color:var(--lime);font-variant-numeric:tabular-nums}.hud small{display:block;color:#b6c9c0;font-size:10px;letter-spacing:1px}
#gearbox{position:fixed;top:91px;left:12px;display:flex;gap:6px;pointer-events:none}.chip{background:#071c16d9;border:1px solid #08a56c77;border-radius:9px;padding:7px 10px;font-size:10px;color:#dcebe2}.chip b{color:var(--lime);font-size:13px}
#controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;max-width:900px;margin:auto}.pad,.pedals{display:flex;gap:9px;pointer-events:auto}.ctrl{position:relative;display:grid;place-items:center;width:66px;height:66px;border-radius:22px;border:1px solid #baf05b66;background:linear-gradient(145deg,#173f32ee,#071c16f2);color:#f4fff8;font-size:25px;font-weight:800;box-shadow:0 9px 24px #0007,inset 0 1px 0 #ffffff20;backdrop-filter:blur(12px);touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}.ctrl:active,.ctrl.down{background:linear-gradient(145deg,#baf05b,#08a56c);border-color:#e4ffad;color:#071c16;transform:scale(.94);box-shadow:0 0 0 4px #baf05b22,0 5px 15px #0007}.pedal{width:70px;height:82px;border-radius:20px;font-size:10px;letter-spacing:.7px}.gas{border-color:#d8ff80;background:linear-gradient(145deg,#d7ff83,#80c92d);color:#102116;box-shadow:0 8px 22px #9cdb3b35,inset 0 1px 0 #fff9}.brake{background:linear-gradient(145deg,#6a292b,#301416);border-color:#f08b8b99;color:#fff}.hand{background:linear-gradient(145deg,#5b5030,#282315);border-color:#e7c87999;font-size:9px;color:#fff}
.topbtn{position:fixed;top:91px;right:12px;border:1px solid #08a56c;background:#071c16dc;color:#fff;border-radius:10px;padding:8px 11px;font-size:10px}
#hint{position:fixed;top:132px;left:50%;transform:translateX(-50%);font-size:10px;color:#d7e8df;background:#071c16a8;padding:7px 11px;border-radius:20px;white-space:nowrap;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#071c16;z-index:5;transition:opacity .5s}#loading div{text-align:center;color:#baf05b;letter-spacing:3px;font-weight:bold}#loading small{display:block;color:#9bb6aa;letter-spacing:1px;margin-top:12px}
#damage{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffd18b;letter-spacing:1px;background:#291b13bb;border:1px solid #d8a65b66;padding:7px 10px;border-radius:9px;opacity:0;transition:opacity .25s;pointer-events:none}
@media(min-width:800px){.ctrl{width:76px;height:76px}.pedal{height:88px;width:82px}} @media(max-width:390px){.ctrl{width:57px;height:57px;border-radius:18px}.pedal{width:59px;height:72px;font-size:9px}.pad,.pedals{gap:6px}#controls{left:9px;right:9px}}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="loading"><div>SHOHIN TAJIKISTAN<small>ЗАПУСК АВТОМОБИЛЬНОГО СИМУЛЯТОРА</small></div></div>
<div id="top"><div class="brand"><b>♛ SHOHIN CITY DRIVE</b><span>REALISTIC DRIVING · DEVELOPMENT BUILD</span></div><div class="hud"><strong id="speed">0</strong><small>KM/H</small></div></div>
<div id="gearbox"><div class="chip">GEAR <b id="gear">N</b></div><div class="chip">MODE <b id="mode">D</b></div></div>
<button class="topbtn" id="cameraBtn">КАМЕРА</button>
<div id="hint">СЕНСОРНОЕ УПРАВЛЕНИЕ · WASD / СТРЕЛКИ</div><div id="damage">СТОЛКНОВЕНИЕ</div>
<div id="controls"><div class="pad"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="pedals"><button class="ctrl hand" data-key="hand">РУЧНИК</button><button class="ctrl pedal brake" data-key="brake">ТОРМОЗ</button><button class="ctrl pedal gas" data-key="gas">ГАЗ ▲</button></div></div>
<script>
const loading=document.getElementById('loading');
function showFatal(message){
 const safe=String(message||'Проверь подключение к интернету.').replace(/[<>]/g,'').slice(0,220);
 loading.style.opacity='1';loading.style.display='grid';
 loading.innerHTML='<div style="max-width:340px;padding:26px;text-align:center;line-height:1.6">SHOHIN CITY DRIVE<small style="display:block;margin-top:14px;color:#ffd18b;letter-spacing:0">Не удалось запустить 3D-сцену.<br>'+safe+'</small><button onclick="location.reload()" style="margin-top:18px;padding:13px 22px;border:1px solid #baf05b;border-radius:14px;background:linear-gradient(135deg,#baf05b,#08a56c);color:#071c16;font-weight:800">ПОВТОРИТЬ ЗАПУСК</button></div>';
}
window.addEventListener('error',e=>{if(e.message)showFatal(e.message)});
window.addEventListener('unhandledrejection',e=>showFatal(e.reason&&e.reason.message||'Ошибка загрузки сцены'));
function loadBabylon(sources,index){
 if(index>=sources.length){showFatal('Не удалось загрузить 3D-библиотеку. Проверь интернет и отключи блокировщик контента.');return;}
 const tag=document.createElement('script');tag.src=sources[index];tag.crossOrigin='anonymous';
 tag.onload=()=>{if(window.BABYLON){try{startGame()}catch(e){showFatal(e&&e.message||'Ошибка создания 3D-сцены')}}else loadBabylon(sources,index+1)};
 tag.onerror=()=>loadBabylon(sources,index+1);
 document.head.appendChild(tag);
}
function startGame(){
 try{
 if(!window.BABYLON)throw new Error('3D-библиотека недоступна');
 const canvas=document.getElementById('renderCanvas');
const mobile=matchMedia('(max-width:800px)').matches;
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:false,antialias:!mobile,powerPreference:'high-performance'});
engine.setHardwareScalingLevel(mobile?1.35:1);
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.56,.72,.79,1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.00165;scene.fogColor=new BABYLON.Color3(.56,.72,.79);
const camera=new BABYLON.FollowCamera('chase camera',new BABYLON.Vector3(0,5,-12),scene);
camera.radius=11;camera.heightOffset=3.5;camera.rotationOffset=180;camera.cameraAcceleration=.055;camera.maxCameraSpeed=20;camera.lowerRadiusLimit=.15;camera.upperRadiusLimit=16;scene.activeCamera=camera;
const hemi=new BABYLON.HemisphericLight('sky light',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.86;
const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.5,-1,.35),scene);sun.position.set(35,65,-30);sun.intensity=1.35;
const mat=(name,color,metal=0,rough=.55)=>{const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);m.specularColor=new BABYLON.Color3(.55,.55,.55);m.specularPower=metal?128:64;m.emissiveColor=new BABYLON.Color3(0,0,0);return m};
const asphalt=mat('deep asphalt','#292f32',.05,.96),lane=mat('road markings','#e0dfd5',0,.8),sidewalk=mat('sidewalk stone','#9b9d98',0,.9),grass=mat('city green','#526d54',0,1),wallM=[mat('warm concrete','#aaa99e'),mat('stone facade','#858f91'),mat('sand facade','#c2b9a7'),mat('dark facade','#687477'),mat('light facade','#c6c5bc')],glass=mat('blue glass','#315563',.35,.2),trim=mat('dark trim','#182222',.35,.35),rubber=mat('tire rubber','#101213',0,.95),rim=mat('forged alloy','#b9c4c5',.85,.22),paint=mat('SHOHIN racing green','#087b53',.72,.22),paintDark=mat('green shadow','#064b37',.6,.28),lamp=mat('LED headlights','#f1f0d8',.15,.2),tail=mat('red tail lights','#b51d25',.2,.25),interior=mat('interior','#101718',.1,.65),brakeDisc=mat('brake discs','#727b7d',.8,.35);
const ground=BABYLON.MeshBuilder.CreateGround('terrain',{width:650,height:650},scene);ground.material=grass;
function box(name,w,h,d,x,y,z,material,parent=null){const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);m.position.set(x,y,z);m.material=material;if(parent)m.parent=parent;return m}
function cylinder(name,diam,height,x,y,z,material,parent,segments=24){const m=BABYLON.MeshBuilder.CreateCylinder(name,{diameter:diam,height,tessellation:segments},scene);m.position.set(x,y,z);m.material=material;if(parent)m.parent=parent;return m}
// Road network and urban blocks.
const roads=[];for(let n=-3;n<=3;n++)roads.push(n*48);
for(const x of roads){box('avenue',20,.08,390,x,.04,0,asphalt);for(let z=-190;z<195;z+=12)box('lane dash',.17,.025,5,x,.095,z,lane)}
for(const z of roads){box('cross street',390,.08,20,0,.045,z,asphalt);for(let x=-190;x<195;x+=12)box('lane dash',5,.025,.17,x,.1,z,lane)}
for(const x of roads)for(const s of [-1,1])box('sidewalk',2.2,.15,390,x+s*11.2,.04,0,sidewalk);
for(const z of roads)for(const s of [-1,1])box('sidewalk',390,.15,2.2,0,.045,z+s*11.2,sidewalk);
let seed=27;const rand=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
const obstacles=[];
for(let gx=-3;gx<=2;gx++)for(let gz=-3;gz<=2;gz++){
 const cx=gx*48+24,cz=gz*48+24;
 for(let k=0;k<3;k++){
  const x=cx+(rand()-.5)*9,z=cz+(rand()-.5)*9,w=10+rand()*7,d=10+rand()*7,h=10+rand()*24;
  const body=box('city building',w,h,d,x,h/2,z,wallM[Math.floor(rand()*wallM.length)]);
  box('roof edge',w+.25,.24,d+.25,x,h+.12,z,trim);
  for(let f=1;f<Math.floor(h/3);f++)for(let c=0;c<Math.max(2,Math.floor(w/2.8));c++){
   const wx=x-w/2+(c+.5)*w/Math.max(2,Math.floor(w/2.8));
   box('facade window',.95,1.35,.055,wx,f*3,z-d/2-.04,glass);
  }
  obstacles.push({x,z,hx:w/2+1.05,hz:d/2+1.05});
 }
}
// Street trees and street lamps placed along sidewalks.
const trunk=mat('tree trunk','#59452f'),foliage=mat('tree foliage','#315c3e'),pole=mat('lamp pole','#414a4a',.5,.4),bulb=mat('lamp glow','#fff0c5',0,.2);
for(let x=-140;x<=140;x+=48)for(let z=-140;z<=140;z+=48){
 if(Math.abs(x)<20&&Math.abs(z)<20)continue;
 for(const s of [-1,1]){const tx=x+s*13,tz=z+13;cylinder('tree trunk',.48,3,tx,1.5,tz,trunk,null,10);const crown=BABYLON.MeshBuilder.CreateSphere('tree crown',{diameter:4.2,segments:8},scene);crown.position.set(tx,4,tz);crown.material=foliage}
 cylinder('street lamp',.16,6,x+13,3,z-13,pole,null,10);box('lamp head',.8,.18,.4,x+13,6,z-13,bulb);
}
// Sports car assembly: shaped proportions, glasshouse, bumpers, lights, wing and detailed wheels.
const car=new BABYLON.TransformNode('SHOHIN GT sports car',scene);
box('underbody',2.02,.42,4.45,0,.72,0,trim,car);
box('wide lower body',2.12,.42,4.3,0,.86,0,paint,car);
box('front hood',1.98,.2,1.45,0,1.08,1.25,paint,car);
box('rear deck',1.98,.2,1.05,0,1.08,-1.62,paint,car);
box('front bumper',2.18,.25,.36,0,.66,2.17,paintDark,car);
box('rear diffuser',2.08,.22,.34,0,.62,-2.18,trim,car);
box('front grille',1.1,.2,.045,0,.76,2.365,trim,car);
box('front splitter',2.24,.09,.5,0,.49,2.15,trim,car);
box('cabin glass',1.58,.74,1.82,0,1.47,-.08,glass,car);
box('roof',1.55,.12,1.12,0,1.87,-.12,paint,car);
box('rear window trim',1.6,.08,.12,0,1.76,-.91,paintDark,car);
box('front windshield frame',1.62,.1,.12,0,1.77,.77,paint,car);
box('dashboard',1.42,.18,.46,0,1.25,.38,interior,car);
box('dashboard display',.48,.18,.04,0,1.39,.55,paint,car);
box('rear wing',2.12,.12,.43,0,1.55,-2.18,trim,car);
for(const x of [-.78,.78])box('wing support',.08,.34,.1,x,1.38,-2.16,rim,car);
for(const x of [-.78,.78]){
 box('headlamp',.43,.13,.08,x,1.03,2.14,lamp,car);
 box('tail lamp',.48,.14,.07,x,1.02,-2.2,tail,car);
 box('side mirror',.23,.14,.28,x*1.25,1.48,.52,trim,car);
 box('side skirt',.12,.18,2.6,x*1.12,.65,-.05,paintDark,car);
}
const wheels=[];
for(const x of [-1.04,1.04])for(const z of [-1.42,1.42]){
 const pivot=new BABYLON.TransformNode('wheel steering pivot',scene);pivot.parent=car;pivot.position.set(x,.58,z);
 const tire=cylinder('performance tire',1.08,.36,0,0,0,rubber,pivot,32);tire.rotation.z=Math.PI/2;
 const disc=cylinder('brake disc',.68,.37,0,0,0,brakeDisc,pivot,24);disc.rotation.z=Math.PI/2;
 const hub=cylinder('alloy wheel',.57,.39,0,0,0,rim,pivot,20);hub.rotation.z=Math.PI/2;
 for(let s=0;s<5;s++){const spoke=box('rim spoke',.075,.08,.48,0,0,0,rim,pivot);spoke.rotation.x=s*Math.PI*2/5;spoke.position.y=Math.sin(s*Math.PI*2/5)*.19;spoke.position.z=Math.cos(s*Math.PI*2/5)*.19}
 wheels.push({pivot,tire,front:z>0});
}
camera.lockedTarget=car;
// Driving dynamics: longitudinal acceleration, braking, drag, steering response, lateral grip and simple collision response.
const keys={left:false,right:false,gas:false,brake:false,hand:false};
document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();keys[k]=true;btn.classList.add('down')},up=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('down')};btn.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,up))});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k==='arrowup'||k==='w')keys.gas=true;if(k==='arrowdown'||k==='s'||k===' ')keys.brake=true;if(k==='shift')keys.hand=true});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k==='arrowup'||k==='w')keys.gas=false;if(k==='arrowdown'||k==='s'||k===' ')keys.brake=false;if(k==='shift')keys.hand=false});
let speed=0,yaw=0,steer=0,lateral=0,gear='N',cameraMode=0,impactTimer=0;
const speedEl=document.getElementById('speed'),gearEl=document.getElementById('gear'),damageEl=document.getElementById('damage');
document.getElementById('cameraBtn').onclick=()=>{cameraMode=(cameraMode+1)%3;if(cameraMode===0){camera.radius=11;camera.heightOffset=3.5;camera.rotationOffset=180}else if(cameraMode===1){camera.radius=6.5;camera.heightOffset=2.4;camera.rotationOffset=180}else{camera.radius=.18;camera.heightOffset=1.62;camera.rotationOffset=180}};
function collides(x,z){for(const o of obstacles)if(Math.abs(x-o.x)<o.hx+.95&&Math.abs(z-o.z)<o.hz+1.75)return true;return false}
function frame(){
 const dt=Math.min(engine.getDeltaTime()/1000,.035);
 const oldX=car.position.x,oldZ=car.position.z;
 const throttle=keys.gas?1:0,braking=keys.brake?1:0;
 if(throttle)speed+=17.5*dt;
 else speed*=Math.pow(.994,dt*60);
 if(braking){speed=Math.max(0,speed-34*dt)}
 if(keys.hand){speed*=Math.pow(.955,dt*60);lateral+=(steer*Math.abs(speed)*.16-lateral)*Math.min(1,dt*2.5)}
 else lateral*=Math.pow(.82,dt*60);
 speed=Math.max(-8,Math.min(58,speed));
 const steerTarget=(keys.right?1:0)-(keys.left?1:0);steer+=(steerTarget-steer)*Math.min(1,dt*6.5);
 const velocityFactor=Math.min(1,Math.abs(speed)/4);
 const turnRate=steer*(.24+velocityFactor*.92)*(keys.hand?1.45:1)*(speed>=0?1:-1);
 yaw+=turnRate*dt;
 const forwardX=Math.sin(yaw),forwardZ=Math.cos(yaw),sideX=Math.cos(yaw),sideZ=-Math.sin(yaw);
 const nx=oldX+(forwardX*speed+sideX*lateral)*dt,nz=oldZ+(forwardZ*speed+sideZ*lateral)*dt;
 if(collides(nx,nz)){
  speed*=-.16;lateral*=-.12;car.position.x=oldX;car.position.z=oldZ;impactTimer=.65;damageEl.style.opacity='1';
 }else{car.position.x=nx;car.position.z=nz}
 if(Math.abs(car.position.x)>185||Math.abs(car.position.z)>185){speed*=.65;car.position.x=Math.max(-185,Math.min(185,car.position.x));car.position.z=Math.max(-185,Math.min(185,car.position.z))}
 car.rotation.y=yaw;car.rotation.z=-(keys.left?1:0)+(keys.right?1:0);car.rotation.z*=Math.min(.035,Math.abs(speed)*.0008);
 wheels.forEach(w=>{w.tire.rotation.x+=speed*dt*1.85;if(w.front)w.pivot.rotation.y=steer*.43});
 camera.lockedTarget=car;
 const kmh=Math.round(Math.abs(speed)*3.6);speedEl.textContent=kmh;
 gear= speed<-.5?'R':speed<.5?'N':kmh<28?'1':kmh<55?'2':kmh<90?'3':kmh<135?'4':'5';gearEl.textContent=gear;
 if(impactTimer>0){impactTimer-=dt;if(impactTimer<=0)damageEl.style.opacity='0'}
}
engine.runRenderLoop(()=>{if(!scene.isDisposed())frame();scene.render()});
window.addEventListener('resize',()=>engine.resize());
setTimeout(()=>{const l=document.getElementById('loading');if(l){l.style.opacity='0';setTimeout(()=>l.remove(),550)}},900);

 }catch(e){showFatal(e&&e.message||'Ошибка создания 3D-сцены')}
}
loadBabylon(['https://cdn.babylonjs.com/babylon.js','https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js','https://unpkg.com/babylonjs@7.54.3/babylon.js'],0);
</script>;
</script>
</body></html>
