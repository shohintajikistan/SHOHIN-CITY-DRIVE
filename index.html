 if(drifting){drift+=Math.abs(speed)*dt*2.2;driftTimer=.3;$('drift').style.opacity=1}else{driftTimer=Math.max(0,driftTimer-dt);if(driftTimer===0)$('drift').style.opacity=0}
 $('speed').textContent=Math.round(Math.abs(speed)*3.6);$('gear').textContent=speed<-.5?'R':Math.abs(speed)<.5?'N':speed<13?'1':speed<24?'2':speed<34?'3':'4';$('driftScore').textContent=Math.floor(drift);
}
function cameraUpdate(dt){
 // Camera follows the car's position only. Its world orientation stays level while steering.
 let desired,target;
 if(view===0){desired=car.position.clone().add(new THREE.Vector3(0,4.1,8));target=car.position.clone().add(new THREE.Vector3(0,1.05,0))}
 else if(view===1){desired=car.position.clone().add(new THREE.Vector3(0,7.2,13));target=car.position.clone().add(new THREE.Vector3(0,.8,0))}
 else{desired=car.position.clone().add(new THREE.Vector3(0,1.75,-1.15));target=car.position.clone().add(new THREE.Vector3(0,1.2,-18))}
 camera.position.lerp(desired,1-Math.exp(-4.2*dt));camera.up.set(0,1,0);camera.lookAt(target);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(started&&!paused)update(dt);cameraUpdate(dt);renderer.render(scene,camera)}
camera.position.set(0,5,11);camera.lookAt(0,0,0);animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
