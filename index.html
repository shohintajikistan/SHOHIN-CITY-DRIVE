<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c16"><title>SHOHIN CITY DRIVE</title>
<style>
:root{--g:#071c16;--g2:#0d3024;--lime:#baf05b;--gold:#e6c46a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071c16;color:#fff;font-family:system-ui,Arial;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;background:linear-gradient(#06150fd9,transparent)}
.brand{font-weight:900;letter-spacing:2px;color:var(--lime);font-size:17px;text-shadow:0 2px 10px #000}.sub{font-size:10px;color:#d4e2d9;letter-spacing:2px}
.stats{display:flex;gap:8px}.pill{background:#071c16d9;border:1px solid #baf05b55;border-radius:12px;padding:7px 10px;min-width:66px;text-align:center;backdrop-filter:blur(8px)}.num{font-size:19px;font-weight:800;color:var(--lime);line-height:1.1}.small{font-size:9px;color:#c7d8ce;letter-spacing:1px}
#hint{position:fixed;top:86px;left:50%;transform:translateX(-50%);font-size:11px;color:#eff7f1;background:#071c16a8;padding:7px 12px;border-radius:20px;white-space:nowrap;pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.cluster{display:flex;gap:12px;align-items:end;pointer-events:auto}
.ctrl{width:66px;height:66px;border-radius:19px;border:1px solid #baf05b88;background:linear-gradient(145deg,#164632eF,#071c16ed);color:white;font-size:25px;font-weight:800;box-shadow:0 7px 20px #0008;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
.ctrl:active,.ctrl.down{background:linear-gradient(145deg,#baf05b,#68a82b);color:#071c16;transform:scale(.96)}
.ctrl.gas{width:76px;height:82px;color:var(--lime);font-size:14px;letter-spacing:1px}.ctrl.brake{height:64px;font-size:12px;color:#ffcfaa}
#menu{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#164632aa,#04110df2 70%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.panel{width:min(440px,100%);text-align:center;background:#071c16eF;border:1px solid #baf05b66;border-radius:26px;padding:28px 22px;box-shadow:0 25px 80px #0009}
.crown{font-size:42px;color:var(--gold);line-height:1}.panel h1{font-size:26px;letter-spacing:2px;margin:12px 0 4px;color:var(--lime)}.panel p{font-size:13px;line-height:1.5;color:#c8d8ce;margin:8px 0 22px}
#start{width:100%;border:0;border-radius:15px;background:linear-gradient(90deg,#baf05b,#d9f99b);color:#071c16;padding:15px;font-weight:900;font-size:15px;letter-spacing:1px}
.note{font-size:10px!important;color:#8ea99a!important;margin:14px 0 0!important}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--lime);background:#071c16d9;padding:12px 16px;border-radius:12px;pointer-events:none}
#reset{position:fixed;right:14px;top:100px;border:1px solid #baf05b66;background:#071c16b8;color:#d9f99b;border-radius:10px;padding:8px 10px;font-size:11px}
@media(min-width:800px){.ctrl{width:74px;height:74px}.ctrl.gas{width:90px;height:90px}#controls{padding:0 5vw 24px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div><div class="brand">♛ SHOHIN</div><div class="sub">CITY DRIVE · CITY</div></div><div class="stats"><div class="pill"><div class="num" id="speed">0</div><div class="small">КМ/Ч</div></div><div class="pill"><div class="num" id="gear">N</div><div class="small">ПЕРЕДАЧА</div></div></div></div>
<div id="hint">ГОРОД · СВОБОДНАЯ ПОЕЗДКА</div>
<button id="reset">↻ СБРОС</button>
<div id="loading">Загрузка города...</div>
<div id="controls">
 <div class="cluster"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div>
 <div class="cluster"><button class="ctrl brake" data-key="brake">ТОРМОЗ</button><button class="ctrl gas" data-key="gas">ГАЗ ▲</button></div>
</div>
<div id="menu"><div class="panel"><div class="crown">♛</div><h1>SHOHIN CITY DRIVE</h1><div class="sub">ГОРОД · OPEN WORLD</div><p>Свободная поездка по 3D-городку. Управляй автомобилем касанием экрана или клавишами.</p><button id="start">НАЧАТЬ ПОЕЗДКУ</button><p class="note">Первая браузерная версия · игра использует интернет для загрузки 3D-библиотеки</p></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const host=document.querySelector('#game'),speedEl=document.querySelector('#speed'),gearEl=document.querySelector('#gear'),loading=document.querySelector('#loading');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc6d7);scene.fog=new THREE.Fog(0x9bc6d7,90,310);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);camera.position.set(0,7,13);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x59634a,2.1));const sun=new THREE.DirectionalLight(0xfff0cf,2.2);sun.position.set(-45,75,35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),mat(0x788b65));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x30383a),lineMat=mat(0xe6dfbd),sideMat=mat(0xaaa99b);
function road(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),roadMat);m.position.set(x,0,z);m.receiveShadow=true;scene.add(m);let horizontal=w>d;let count=horizontal?Math.floor(w/9):Math.floor(d/9);for(let i=-count/2;i<count/2;i++){let dash=new THREE.Mesh(new THREE.BoxGeometry(horizontal?3:.13,.025,horizontal?.13:3),lineMat);dash.position.set(x+(horizontal?i*9:0),.075,z+(horizontal?0:i*9));scene.add(dash)}}
road(0,0,600,15);road(0,0,15,600);road(0,-85,600,12);road(95,0,12,600);road(-100,0,12,600);
const bMats=[0xc9b99d,0xd8d2c1,0x9eaeb1,0xd9c7a6,0xb9c4b1].map(c=>mat(c));
function building(x,z,w,h,d,idx){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bMats[idx%5]);m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);let roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.4,.35,d+.4),mat(0x59635b));roof.position.set(x,h+.15,z);scene.add(roof);for(let y=2;y<h-1;y+=2.7)for(let xx=-w/2+1;xx<w/2-0.4;xx+=2.2){let win=new THREE.Mesh(new THREE.BoxGeometry(.95,1.25,.06),mat(0x547b85,.35));win.position.set(x+xx,y,z-d/2-.04);scene.add(win)}}
let seed=17;function rand(){seed=(seed*9301+49297)%233280;return seed/233280}
for(let gx=-250;gx<=250;gx+=34)for(let gz=-250;gz<=250;gz+=34){if(Math.abs(gx)<20||Math.abs(gz)<20||Math.abs(gz+85)<15||Math.abs(gx-95)<15||Math.abs(gx+100)<15)continue;let w=12+rand()*12,d=12+rand()*12,h=8+rand()*32;building(gx+(rand()-.5)*7,gz+(rand()-.5)*7,w,h,d,Math.floor(rand()*5))}
const mountainMat=mat(0x748a85);for(let i=0;i<24;i++){let a=i/24*Math.PI*2,r=230+rand()*35,h=35+rand()*65;let m=new THREE.Mesh(new THREE.ConeGeometry(25+rand()*20,h,5),mountainMat);m.position.set(Math.cos(a)*r,h/2-2,Math.sin(a)*r);m.rotation.y=rand()*3;scene.add(m)}
// Street lamps
for(let x=-180;x<=180;x+=35){for(let z of [-11,11]){let pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,5,6),mat(0x303b35));pole.position.set(x,2.5,z);scene.add(pole);let arm=new THREE.Mesh(new THREE.BoxGeometry(1.3,.12,.12),mat(0x303b35));arm.position.set(x+.55,4.8,z);scene.add(arm)}}
const carRoot=new THREE.Group();scene.add(carRoot);let carVisual=new THREE.Group();carRoot.add(carVisual);
function fallbackCar(){let body=new THREE.Mesh(new THREE.BoxGeometry(2.05,.65,4.1),mat(0x087b53,.32));body.position.y=.75;body.castShadow=true;carVisual.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.75,2),mat(0x182b2b,.25));cabin.position.set(0,1.38,-.15);cabin.castShadow=true;carVisual.add(cabin);for(let x of [-1,1])for(let z of [-1.35,1.35]){let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,16),mat(0x16191a));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.42,z);carVisual.add(wheel)}}
fallbackCar();
const loader=new GLTFLoader();loader.load('https://raw.githubusercontent.com/shohintajikistan/SHOHIN-CITY-DRIVE/main/assets/models/shohin_car.glb',g=>{carVisual.clear();let model=g.scene;model.scale.setScalar(.9);model.rotation.y=Math.PI;model.position.y=0;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});carVisual.add(model);loading.style.display='none'},undefined,()=>{loading.textContent='Город готов';setTimeout(()=>loading.style.display='none',1200)});
carRoot.position.set(0,0,24);
const keys={left:false,right:false,gas:false,brake:false};document.querySelectorAll('[data-key]').forEach(btn=>{let k=btn.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;btn.classList.add('down')},off=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('down')};btn.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,off))});
addEventListener('keydown',e=>{let k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake'}[e.key];if(k)keys[k]=true});addEventListener('keyup',e=>{let k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake'}[e.key];if(k)keys[k]=false});
let velocity=0,heading=0,started=false;const clock=new THREE.Clock();
function reset(){carRoot.position.set(0,0,24);heading=0;velocity=0}
document.querySelector('#reset').onclick=reset;
document.querySelector('#start').onclick=()=>{started=true;document.querySelector('#menu').style.display='none'};
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(started){if(keys.gas)velocity=Math.min(velocity+22*dt,48);else velocity=Math.max(0,velocity-5*dt);if(keys.brake)velocity=Math.max(-8,velocity-38*dt);if(Math.abs(velocity)>.5){let steer=(keys.left?1:0)-(keys.right?1:0);heading+=steer*dt*(1.5+Math.abs(velocity)*.035)*Math.sign(velocity);carRoot.position.x+=Math.sin(heading)*velocity*dt;carRoot.position.z-=Math.cos(heading)*velocity*dt;}carRoot.rotation.y=heading;speedEl.textContent=Math.round(Math.abs(velocity)*3.6);gearEl.textContent=velocity<-.5?'R':velocity>.5?'D':'N';}
let target=new THREE.Vector3(carRoot.position.x+Math.sin(heading)*10,5.8,carRoot.position.z-Math.cos(heading)*10);camera.position.lerp(target,.08);let look=new THREE.Vector3(carRoot.position.x,1.1,carRoot.position.z);camera.lookAt(look);renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
