 const intakeDark=addCarMesh(new THREE.BoxGeometry(.035,.19,.46),carbonMat,x*1.065,.78,.94);
 for(let n=0;n<3;n++){
  const fin=addCarMesh(new THREE.BoxGeometry(.025,.025,.36),rimMat,x*1.085,.73+n*.055,.94);
 }
}
// Wide rear wing with curved-looking end plates and carbon supports.
addCarMesh(new THREE.BoxGeometry(1.92,.095,.42),carbonMat,0,1.28,1.72);
for(const x of [-.69,.69]){
 const support=addCarMesh(new THREE.BoxGeometry(.075,.32,.13),carbonMat,x,1.12,1.62);
 const endplate=addCarMesh(new THREE.BoxGeometry(.055,.24,.36),carPaint,x*1.38,1.28,1.72);
}
// Mirrors with dark bases, door handles and small side indicators.
for(const x of [-1,1]){
 const mirrorStem=addCarMesh(new THREE.BoxGeometry(.11,.11,.24),carbonMat,x*1.22,1.16,-.59);
 const mirrorCap=addCarMesh(new THREE.SphereGeometry(.14,16,12),carPaint,x*1.34,1.23,-.62);
 mirrorCap.scale.set(1,.65,1.25);
 const indicator=addCarMesh(new THREE.BoxGeometry(.025,.035,.16),headMat,x*1.355,1.22,-.54);
 const handle=addCarMesh(new THREE.BoxGeometry(.035,.045,.24),rimMat,x*1.01,.83,.28);
}
// Front Porsche-inspired light housings and a continuous rear light signature.
for(const x of [-.67,.67]){
 const bezel=addCarMesh(new THREE.SphereGeometry(.205,20,12),darkMat,x,.79,-1.84);
 bezel.scale.set(1,.38,.48);
 const led=addCarMesh(new THREE.BoxGeometry(.28,.035,.07),headMat,x,.82,-1.91);
 const rearReflector=addCarMesh(new THREE.BoxGeometry(.32,.055,.045),tailMat,x,.85,1.91);
}
// Small premium details: badge, grille mesh, exhaust surrounds and brake ducts.
addCarMesh(new THREE.BoxGeometry(.24,.035,.055),mat(0xe1c36b,.22,.8),0,.87,-1.96);
addCarMesh(new THREE.BoxGeometry(.88,.12,.045),carbonMat,0,.54,-2.09);
for(const x of [-.55,.55]){
 const duct=addCarMesh(new THREE.BoxGeometry(.3,.13,.055),carbonMat,x,.59,-2.075);
 const exhaustRing=addCarMesh(new THREE.CylinderGeometry(.12,.12,.04,20),rimMat,x,.48,2.04);
 exhaustRing.rotation.x=Math.PI/2;
}
// Move the car geometry into a raised pivot so it rolls around its centre, not the ground.
for(const part of carBody.children)part.position.y-=.55;
carBody.position.y=.55;
// Player and driving physics.
car.position.set(0,0,0);let heading=0,speed=0,slip=0,lateralSpeed=0,drift=0,started=false,paused=false,view=0,handbrake=false;
const keys={left:false,right:false,gas:false,brake:false,hand:false};
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('down')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off))});
addEventListener('keydown',e=>{const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'hand'};if(map[e.key])keys[map[e.key]]=true});
addEventListener('keyup',e=>{const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'hand'};if(map[e.key])keys[map[e.key]]=false});
$('cameraBtn').onclick=()=>{view=(view+1)%3;$('cameraBtn').textContent=['КАМЕРА 3','КАМЕРА 2','КАМЕРА 1'][view]};
document.querySelectorAll('[data-car]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.car);carPaint.color.setHex(colors[selected]);document.querySelectorAll('[data-car]').forEach(x=>x.classList.toggle('active',x===b))}));
$('start').onclick=()=>{$('menu').style.display='none';started=true;paused=false};
$('pause').onclick=()=>{if(!started)return;paused=!paused;$('pause').textContent=paused?'▶ ПРОДОЛЖИТЬ':'Ⅱ ПАУЗА'};
const clock=new THREE.Clock();let driftTimer=0;
function update(dt){
 const steer=(keys.left?1:0)-(keys.right?1:0);
 const hand=keys.hand,throttle=keys.gas?1:0,braking=keys.brake?1:0;
 // Engine, service brake and reverse: speed is measured in metres per second.
 if(throttle){
  if(speed<0)speed=Math.min(0,speed+24*dt);
  else speed=THREE.MathUtils.damp(speed,43,2.0,dt);
 }else if(braking){
  if(speed>0)speed=Math.max(0,speed-30*dt);
  else speed=Math.max(-9,speed-9*dt);
 }else speed=THREE.MathUtils.damp(speed,0,.48,dt);
 const speedFactor=Math.min(1,Math.abs(speed)/18);
 // Front-wheel steering follows a bicycle model: the car turns toward the steering input.
 const maxSteer=THREE.MathUtils.lerp(.52,.28,speedFactor);
 const steerAngle=steer*maxSteer;
 const wheelBase=2.56;
 const yawRate=(speed/wheelBase)*Math.tan(steerAngle);
 heading+=yawRate*dt;
 // Handbrake releases rear grip and creates controlled lateral momentum.
 const lateralTarget=hand&&Math.abs(speed)>5?steer*Math.abs(speed)*.34:0;
 lateralSpeed=THREE.MathUtils.damp(lateralSpeed,lateralTarget,hand?2.8:5.5,dt);
 if(!hand)lateralSpeed*=Math.exp(-1.25*dt);
 slip=THREE.MathUtils.damp(slip,Math.atan2(lateralSpeed,Math.max(2,Math.abs(speed))),5,dt);
 car.rotation.y=heading;
 const forward=new THREE.Vector3(Math.sin(heading),0,-Math.cos(heading));
 const side=new THREE.Vector3(Math.cos(heading),0,Math.sin(heading));
 const previous=car.position.clone();
 const travel=new THREE.Vector3().addScaledVector(forward,speed*dt).addScaledVector(side,lateralSpeed*dt);
 car.position.add(travel);
 car.position.x=THREE.MathUtils.clamp(car.position.x,-198,198);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-198,198);
 // Buildings have solid collision boundaries; stop the car at the first contact.
 let hit=null;
 for(const b of buildingColliders){
  const dx=Math.abs(car.position.x-b.x),dz=Math.abs(car.position.z-b.z);
  if(dx<b.hx&&dz<b.hz){hit=b;break}
 }
 if(hit){
  const dx=Math.abs(car.position.x-hit.x),dz=Math.abs(car.position.z-hit.z);
  if(dx/hit.hx>dz/hit.hz)car.position.x=previous.x;
  else car.position.z=previous.z;
  if(Math.abs(speed)>2){
   speed*=-.16;
   lateralSpeed*=.18;
   rollVelX+=(Math.random()-.5)*Math.min(1.2,Math.abs(speed)*.06);
   rollVelZ+=(Math.random()-.5)*Math.min(1.2,Math.abs(speed)*.06);
  }
 }
 // Body suspension/roll reacts to steering and collisions; camera never rolls with the car.
 const cornering=Math.max(-1,Math.min(1,yawRate*speed/18));
 rollVelZ+=(-cornering*.42-rollZ*8)*dt;
 rollVelX+=(-Math.sin(heading)*0-rollX*8)*dt;
 rollX+=rollVelX*dt;rollZ+=rollVelZ*dt;
 rollVelX*=Math.exp(-3.2*dt);rollVelZ*=Math.exp(-3.2*dt);
 if(Math.abs(rollX)<.008&&Math.abs(rollVelX)<.02){rollX=0;rollVelX=0}
 if(Math.abs(rollZ)<.008&&Math.abs(rollVelZ)<.02){rollZ=0;rollVelZ=0}
 carBody.rotation.set(rollX,0,rollZ);
 carBody.position.y=Math.max(.55,.55+Math.abs(rollZ)*.2);
 // All four wheels spin with road speed; only the front wheels steer.
 for(const w of wheelParts){
  w.tire.rotation.x-=speed*dt/.43;
  w.rim.rotation.x-=speed*dt/.43;
  if(w.front)w.pivot.rotation.y=THREE.MathUtils.damp(w.pivot.rotation.y,steerAngle,12,dt);
 }
 const drifting=hand&&Math.abs(speed)>7&&Math.abs(steer)>.05;
 if(drifting){drift+=Math.abs(speed)*dt*2.2;driftTimer=.3;$('drift').style.opacity=1}
 else{driftTimer=Math.max(0,driftTimer-dt);if(driftTimer===0)$('drift').style.opacity=0}
 $('speed').textContent=Math.round(Math.abs(speed)*3.6);
 $('gear').textContent=speed<-.5?'R':Math.abs(speed)<.5?'N':speed<13?'1':speed<24?'2':speed<34?'3':'4';
 $('driftScore').textContent=Math.floor(drift);
}
function cameraUpdate(dt){
 // Chase camera stays behind the car's actual heading and remains horizon-level.
 const forward=new THREE.Vector3(Math.sin(heading),0,-Math.cos(heading));
 const desired,target;
 if(view===0){
  desired=car.position.clone().addScaledVector(forward,-8).add(new THREE.Vector3(0,3.7,0));
  target=car.position.clone().addScaledVector(forward,2).add(new THREE.Vector3(0,1.05,0));
 }else if(view===1){
  desired=car.position.clone().addScaledVector(forward,-13).add(new THREE.Vector3(0,6.8,0));
  target=car.position.clone().addScaledVector(forward,2).add(new THREE.Vector3(0,.8,0));
 }else{
  desired=car.position.clone().addScaledVector(forward,1.5).add(new THREE.Vector3(0,1.65,0));
  target=car.position.clone().addScaledVector(forward,19).add(new THREE.Vector3(0,1.2,0));
 }
 camera.position.lerp(desired,1-Math.exp(-5*dt));
 camera.up.set(0,1,0);
 camera.lookAt(target);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(started&&!paused)update(dt);cameraUpdate(dt);renderer.render(scene,camera)}
camera.position.set(0,5,11);camera.lookAt(0,0,0);animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
