<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6bc4d8;color:#fff;font-family:system-ui,Arial;touch-action:none}canvas{display:block}#game{position:fixed;inset:0}.top{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 30px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(#06150fe8,transparent);pointer-events:none}.brand{font-size:16px;font-weight:950;letter-spacing:2px;color:#baf05b}.sub{font-size:9px;letter-spacing:2px;color:#e2eee5}.stats{display:flex;gap:6px}.stat{min-width:58px;text-align:center;padding:7px 9px;border-radius:12px;background:#071c16dc;border:1px solid #baf05b66}.value{font-size:18px;font-weight:900;color:#baf05b;line-height:1.1}.label{font-size:8px;letter-spacing:1px;color:#c7d9ce}.bottom{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}.group{display:flex;gap:9px;pointer-events:auto}.key{width:61px;height:61px;border-radius:18px;border:1px solid #baf05b99;background:linear-gradient(145deg,#174c35ed,#071c16ed);color:#fff;font-size:23px;font-weight:900;touch-action:none;user-select:none}.key:active,.key.down{background:#baf05b;color:#071c16}.key.gas{height:78px;width:72px;font-size:12px;color:#baf05b}.key.brake{height:60px;font-size:10px;color:#ffd3b1}#hint{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#071c16b8;border-radius:20px;padding:7px 12px;font-size:10px;white-space:nowrap;pointer-events:none}#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,#1c654bc9,#03110cf5 74%)}.panel{width:min(420px,100%);padding:27px 22px;text-align:center;background:#071c16f2;border:1px solid #baf05b77;border-radius:25px;box-shadow:0 20px 70px #0009}.crown{font-size:40px;color:#e6c46a}.panel h1{margin:8px 0;color:#baf05b;font-size:25px;letter-spacing:1px}.panel p{font-size:13px;line-height:1.5;color:#d0dfd5}.primary{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,#baf05b,#e2f7a9);color:#071c16;font-weight:950;font-size:15px;letter-spacing:1px}.smallnote{font-size:10px!important;color:#91aa9a!important}#reset{position:fixed;right:12px;top:106px;z-index:2;border:1px solid #baf05b77;background:#071c16c9;color:#d9f99b;border-radius:10px;padding:8px 10px;font-size:10px}#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:23px;font-weight:950;color:#fff;text-shadow:0 3px 12px #000;pointer-events:none;opacity:0;transition:opacity .2s}#pause{position:fixed;left:12px;top:104px;z-index:2;border:1px solid #baf05b77;background:#071c16c9;color:#d9f99b;border-radius:10px;padding:8px 10px;font-size:10px}
</style></head><body><div id="game"></div>
<div class="top"><div><div class="brand">♛ SHOHIN</div><div class="sub">BEACH RACING · TROPICAL CUP</div></div><div class="stats"><div class="stat"><div class="value" id="speed">0</div><div class="label">KM/H</div></div><div class="stat"><div class="value" id="lap">1/3</div><div class="label">LAP</div></div><div class="stat"><div class="value" id="place">4/4</div><div class="label">PLACE</div></div></div></div>

<div id="menu"><div class="panel"><div class="crown">♛</div><h1>SHOHIN BEACH RACING</h1><div class="sub">TROPICAL ISLAND CHAMPIONSHIP</div><p>Тропическая гоночная трасса, соперники, трамплины, контрольные точки и три круга. Обгони всех и первым пересечь финиш.</p><button class="primary" id="start">НАЧАТЬ ГОНКУ</button><p class="smallnote">3D · TOUCH CONTROL · RACE MODE</p></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id),host=$('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78c9dc);scene.fog=new THREE.Fog(0x78c9dc,125,290);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5faff,0x8b7752,1.8));const sun=new THREE.DirectionalLight(0xffe9bf,2.1);sun.position.set(-55,90,45);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.88)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const sand=mat(0xe5cb8e),seaMat=mat(0x087f9d,.35),roadMat=mat(0x9c7950),white=mat(0xf8edcf),red=mat(0xc83d25),green=mat(0x18824b),dark=mat(0x151b1c),wood=mat(0x704521);
function addBox(x,y,z,w,h,d,m,yaw=0,collide=false){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.rotation.y=yaw;mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600),seaMat);sea.rotation.x=-Math.PI/2;sea.position.y=-1.5;scene.add(sea);
const island=new THREE.Mesh(new THREE.CylinderGeometry(105,112,2,72),sand);island.position.y=-.35;island.receiveShadow=true;scene.add(island);
const pts=[[-42,48],[-20,58],[10,59],[38,50],[54,32],[57,9],[49,-13],[35,-32],[12,-44],[-15,-47],[-39,-35],[-56,-15],[-60,10],[-55,32]].map(p=>new THREE.Vector3(p[0],0,p[1]));
const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p.x,0,p.z)),true,'catmullrom',.15);
const trackSamples=curve.getPoints(280);
const roadGeo=new THREE.BufferGeometry(),verts=[],indices=[],uv=[];
for(let i=0;i<trackSamples.length;i++){const p=trackSamples[i],t=curve.getTangentAt(i/(trackSamples.length-1));const n=new THREE.Vector3(t.z,0,-t.x).normalize();for(const s of [-1,1]){const v=p.clone().addScaledVector(n,s*8);verts.push(v.x,.12,v.z);uv.push(0,i/12)}}
for(let i=0;i<trackSamples.length-1;i++){const a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}
roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));roadGeo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));roadGeo.setIndex(indices);roadGeo.computeVertexNormals();const roadMesh=new THREE.Mesh(roadGeo,roadMat);roadMesh.receiveShadow=true;scene.add(roadMesh);
for(let i=0;i<trackSamples.length-1;i+=4){const p=trackSamples[i],t=curve.getTangentAt(i/(trackSamples.length-1)),n=new THREE.Vector3(t.z,0,-t.x).normalize(),yaw=Math.atan2(t.x,t.z);for(const s of [-1,1]){const q=p.clone().addScaledVector(n,s*8.8);addBox(q.x,.28,q.z,1.05,.42,3.2,Math.floor(i/4)%2?white:red,yaw)}}
function palm(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2*s,.34*s,4.8*s,7),wood);trunk.position.set(x,2.4*s,z);trunk.castShadow=true;scene.add(trunk);for(let j=0;j<7;j++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(1.55*s,8,6),mat(j%2?0x168145:0x279d50));leaf.scale.set(1,.14,.42);leaf.position.set(x+Math.cos(j*THREE.MathUtils.DEG2RAD*360/7)*1.25*s,4.7*s,z+Math.sin(j*THREE.MathUtils.DEG2RAD*360/7)*1.25*s);leaf.rotation.y=-j*THREE.MathUtils.DEG2RAD*360/7;leaf.castShadow=true;scene.add(leaf)}}
for(let i=0;i<58;i++){const a=i/58*Math.PI*2,r=76+(i%4)*6;palm(Math.cos(a)*r,Math.sin(a)*r,.72+(i%3)*.1)}
// Scenic rocks, beach umbrellas, bridge and jump ramp.
for(let i=0;i<18;i++){const a=i*.73,r=68+(i%5)*3;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1.5+(i%3)*.4,0),mat(0x777b6a));rock.position.set(Math.cos(a)*r,.8,Math.sin(a)*r);rock.scale.y=.7;scene.add(rock)}
for(let i=0;i<5;i++){const x=-60+i*28;const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.5,7),white);pole.position.set(x,1.25,65);scene.add(pole);const canopy=new THREE.Mesh(new THREE.ConeGeometry(2.2,.7,8),i%2?red:green);canopy.position.set(x,2.7,65);scene.add(canopy)}
addBox(54,.42,17,17,.55,7,wood,-.16);addBox(-3,.55,-44,8,1.1,8,red,-.08);
const startT=curve.getTangentAt(.005),startYaw=Math.atan2(-startT.x,-startT.z);
function buggy(color){const root=new THREE.Group();const chassis=new THREE.Mesh(new THREE.BoxGeometry(2,.62,3.6),mat(color,.32));chassis.position.y=.65;chassis.castShadow=true;root.add(chassis);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.42,.72,1.55),mat(0x1d343b,.25));cabin.position.set(0,1.2,-.15);cabin.castShadow=true;root.add(cabin);const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.05,.2,.25),dark);bumper.position.set(0,.42,-1.85);root.add(bumper);for(const x of [-1,1])for(const z of [-1.17,1.17]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.28,14),dark);w.rotation.z=Math.PI/2;w.position.set(x,.35,z);w.castShadow=true;root.add(w)}return root}
const player=buggy(0x087b53);player.position.set(pts[0].x,.15,pts[0].z+5);player.rotation.y=startYaw;scene.add(player);
const rivals=[];[0xe64b24,0x2866dc,0xe5b52a].forEach((c,i)=>{const car=buggy(c);car.position.set(pts[0].x+(i-1)*3,.15,pts[0].z+10+i*3);scene.add(car);rivals.push({car,t:.012+i*.006,base:18+i*1.5,lap:0})});
const gate=new THREE.Group();const gateMat=mat(0xbaf05b);for(const x of [-8,8]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,4,8),gateMat);p.position.set(x,2,0);gate.add(p)}const bar=new THREE.Mesh(new THREE.BoxGeometry(16,.35,.4),gateMat);bar.position.y=4;gate.add(bar);gate.position.set(pts[0].x,0,pts[0].z);gate.rotation.y=startYaw;scene.add(gate);
const pickups=[];for(let i=0;i<8;i++){const t=.07+i*.105,p=curve.getPointAt(t);const orb=new THREE.Mesh(new THREE.TorusGeometry(.72,.22,8,18),mat(0xbaf05b,.25));orb.position.set(p.x,1.35,p.z);orb.rotation.x=Math.PI/2;scene.add(orb);pickups.push({mesh:orb,taken:false})}
const obstacleList=[];for(let i=0;i<7;i++){const t=.11+i*.115,p=curve.getPointAt(t),n=new THREE.Vector3(1,0,0);const o=addBox(p.x+(i%2?4:-4),.55,p.z,1.5,1.1,1.5,i%2?red:wood);obstacleList.push(o)}
const keys={left:false,right:false,gas:false,brake:false};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key,on=e=>{e.preventDefault();keys[k]=true;b.classList.add('down')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off))});
addEventListener('keydown',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake', ' ':'gas'}[e.key];if(k)keys[k]=true});addEventListener('keyup',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'gas'}[e.key];if(k)keys[k]=false});
let speed=0,heading=startYaw,lap=1,progress=0,started=false,paused=false,finished=false,boost=0,coins=0;const clock=new THREE.Clock();
function nearestTrackT(pos){let best=1e9,bt=0;for(let i=0;i<180;i++){const t=i/180,p=curve.getPointAt(t),d=p.distanceToSquared(pos);if(d<best){best=d;bt=t}}return {t:bt,d:Math.sqrt(best)}}
function reset(){player.position.set(pts[0].x,.15,pts[0].z+5);heading=startYaw;player.rotation.y=heading;speed=0;lap=1;progress=0;boost=0;coins=0;finished=false;pickups.forEach(p=>{p.taken=false;p.mesh.visible=true});rivals.forEach((r,i)=>{r.t=.012+i*.006;r.lap=0;r.car.position.set(pts[0].x+(i-1)*3,.15,pts[0].z+10+i*3)});$('lap').textContent='1/3';$('place').textContent='4/4';$('toast').style.opacity=0}
$('reset').onclick=reset;$('start').onclick=()=>{started=true;$('menu').style.display='none'};$('pause').onclick=()=>{if(!started||finished)return;paused=!paused;$('pause').textContent=paused?'▶ ПРОДОЛЖИТЬ':'Ⅱ ПАУЗА'};
function notify(s){$('toast').textContent=s;$('toast').style.opacity=1;setTimeout(()=>{$('toast').style.opacity=0},900)}
function rivalStep(r,dt){r.t=(r.t+r.base*dt/curve.getLength())%1;const p=curve.getPointAt(r.t),tan=curve.getTangentAt(r.t);r.car.position.set(p.x,.15,p.z);r.car.rotation.y=Math.atan2(-tan.x,-tan.z)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);if(started&&!paused&&!finished){if(keys.gas)speed=Math.min(36,speed+(boost>0?29:18)*dt);else speed=Math.max(0,speed-3.7*dt);if(keys.brake)speed=Math.max(-7,speed-25*dt);if(boost>0)boost-=dt;const steer=(keys.left?1:0)-(keys.right?1:0);if(Math.abs(speed)>.1)heading+=steer*dt*(1.2+Math.abs(speed)*.034)*Math.sign(speed);player.rotation.y=heading;const forward=new THREE.Vector3(Math.sin(heading),0,-Math.cos(heading));player.position.addScaledVector(forward,speed*dt);const near=nearestTrackT(player.position);if(near.d>11)speed*=Math.max(.91,1-dt*1.8);if(near.d>27){const back=curve.getPointAt(near.t);player.position.lerp(back,.025);speed*=.97}
for(const r of rivals)rivalStep(r,dt);
for(const r of rivals){if(player.position.distanceTo(r.car.position)<2.6){speed*=.72;notify('СТОЛКНОВЕНИЕ!')}}
for(const o of obstacleList){if(player.position.distanceTo(o.position)<2.3){speed*=.7;o.rotation.y+=dt*.5}}
for(const p of pickups){if(!p.taken&&player.position.distanceTo(p.mesh.position)<2.4){p.taken=true;p.mesh.visible=false;boost=3.5;coins++;notify('ТУРБО-БОНУС!')}}
const old=progress;progress=near.t;if(old>.85&&progress<.15&&speed>2){lap++;if(lap>3){finished=true;speed=0;notify('ФИНИШ!');$('menu').style.display='flex';document.querySelector('.panel h1').textContent='ПОБЕДА SHOHIN!';document.querySelector('.panel p').textContent='Гонка завершена. Бонусы: '+coins+'. Нажми, чтобы проехать ещё раз.'; $('start').textContent='ЕЩЁ ОДНА ГОНКА'}else{notify('КРУГ '+lap)}$('lap').textContent=Math.min(lap,3)+'/3'}
const playerT=near.t;let rank=1;for(const r of rivals){const diff=(r.t-playerT+1)%1;if(diff<.5)rank++}$('place').textContent=rank+'/4';$('speed').textContent=Math.round(Math.abs(speed)*3.6)}
const back=new THREE.Vector3(-Math.sin(heading)*10,6.3,Math.cos(heading)*10);const desired=player.position.clone().add(back);camera.position.lerp(desired,.08);camera.lookAt(player.position.x,1.0,player.position.z);renderer.render(scene,camera)}
camera.position.set(player.position.x,8,player.position.z+14);animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
