name: SHOHIN CITY DRIVE - Unity Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity Personal license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build with Unity 6.3 LTS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.3.28f1
          targetPlatform: Android
          buildMethod: SHOHIN.Editor.SHOHINProjectBuilder.BuildAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SHOHIN-CITY-DRIVE-Android
          path: UnityProject/Build/Android/*.apk
          if-no-files-found: warn
          retention-days: 14
