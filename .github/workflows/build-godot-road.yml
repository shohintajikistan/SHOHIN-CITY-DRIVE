name: Build and Deploy SHOHIN CITY DRIVE (Godot 4)

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/build-godot-road.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare export directory
        run: mkdir -p site
      - name: Install Godot 4.4.1 Web export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p /github/home/.local/share/godot/export_templates/4.4.1.stable
          cp /tmp/godot-templates/templates/web_nothreads_debug.zip /github/home/.local/share/godot/export_templates/4.4.1.stable/
          cp /tmp/godot-templates/templates/web_nothreads_release.zip /github/home/.local/share/godot/export_templates/4.4.1.stable/
      - name: Import Godot project
        run: godot --headless --path godot --editor --quit
      - name: Export Godot Web build
        run: godot --headless --path godot --export-release "Web" ../site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
